name: Local deployment to Kind
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  deploy-windows:
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v6
      - name: Helm deployment
        env:
          POSTGRESQL_PASSWORD: ${{ secrets.POSTGRESQL_PASSWORD }}
        run: |
          helm upgrade postgresql bitnami/postgresql --version 14.2.3 --namespace cubix --set auth.password="$env:POSTGRESQL_PASSWORD" --values values.yaml --install --set image.repository=bitnamilegacy/postgresql --set volumePermissions.image.repository=bitnamilegacy/os-shell --set metrics.image.repository=bitnamilegacy/postgres-exporter --set global.security.allowInsecureImages=true
